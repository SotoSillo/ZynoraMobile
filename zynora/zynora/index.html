<html lang="nl"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: zm: 'unsafe-inline'; connect-src 'self' https://lrclib.net https://api.lyrics.ovh zm:; media-src 'self' file: zm: https: blob:; img-src 'self' data: file: https:">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><title>Zynora</title>
<style>
:root{--ac:#ffd21f;--on:#14110a;--tx:#f4f7fb;--mu:#a9b8cb;--bd:rgba(255,255,255,.16);--bl:24px;--ly:1;--tr:60;--tg:140;--tb:170;--ease:cubic-bezier(.2,.8,.2,1);--fh:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.4 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--tx);overflow:hidden;user-select:none;background:linear-gradient(rgba(5,9,18,.2),rgba(5,9,18,.5)),var(--bgu,url(assets/bg.jpg)) center/cover fixed #0a1018}
i{display:grid;place-items:center}svg{width:18px;height:18px;fill:currentColor;display:block;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
small,.mu{color:var(--mu)}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 60%),rgba(10,16,28,.46);backdrop-filter:blur(var(--bl)) saturate(1.7) brightness(1.05);border:1px solid var(--bd);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.3),0 20px 60px rgba(0,0,0,.38)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0),rgba(255,255,255,.14),transparent 45%) fixed}
.lite .glass{backdrop-filter:none;background:rgba(12,18,30,.86)}.lite .glass::after{display:none}
.noanim *{animation:none!important;transition:none!important}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.cv{display:grid;place-items:center;font-weight:900;color:#fff;border-radius:10px;flex:none;background-size:cover}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mu);transition:background .2s,color .2s}
.ib:hover{background:rgba(255,255,255,.14);color:var(--tx)}
.chip{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--bd);font-weight:600;transition:transform .2s var(--ease),background .2s}
.chip:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on)}
.chip.dng:hover{background:#ff4d6d;color:#fff}
#app{height:100%;display:grid;grid-template-columns:78px 1fr;grid-template-rows:1fr 88px;gap:14px;padding:14px}
/* rail */
#rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.lg{width:44px;height:44px;display:grid;place-items:center;font:900 italic 26px var(--fh);color:var(--on);background:var(--ac);transform:skewX(-12deg);border-radius:8px;margin-bottom:10px;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.rb{position:relative;isolation:isolate;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--mu);transition:color .2s,transform .3s var(--ease)}
.rb::before{content:"";position:absolute;inset:6px 4px;background:var(--ac);transform:skewX(-14deg) scaleX(0);transform-origin:left;border-radius:6px;z-index:-1;transition:transform .35s var(--ease)}
.rb:hover{color:var(--tx);transform:translateX(2px)}
.rb.on{color:var(--on)}.rb.on::before{transform:skewX(-14deg) scaleX(1)}
.rb svg{width:22px;height:22px}
/* main */
#main{display:flex;flex-direction:column;overflow:hidden;min-height:0}
#top{display:flex;justify-content:flex-end;padding:16px 24px 0;position:relative;z-index:3}
.sb{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:999px;padding:0 14px;width:min(300px,100%);transition:border-color .2s,background .2s}
.sb:focus-within{border-color:var(--ac);background:rgba(255,255,255,.16)}
#q{background:none;border:0;outline:0;padding:9px 0;width:100%;user-select:text}#q::placeholder{color:var(--mu)}
#view{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
#view.in>*{animation:up .55s var(--ease) both}#view.in>*:nth-child(2){animation-delay:.06s}#view.in>*:nth-child(3){animation-delay:.1s}#view.in>*:nth-child(4){animation-delay:.14s}
.hero{padding:4px 30px 6px}
.kicker{display:inline-block;background:var(--ac);color:var(--on);font:900 12px var(--fh);letter-spacing:.2em;text-transform:uppercase;padding:3px 16px;transform:skewX(-14deg)}
.h1{font:900 italic clamp(32px,5.2vw,66px)/1.04 var(--fh);text-transform:uppercase;letter-spacing:-.02em;margin:10px 0 6px;text-shadow:4px 4px 0 rgba(0,0,0,.55);transform:skewX(-6deg);transform-origin:left;word-break:break-word}
.acts{display:flex;align-items:center;gap:12px;padding:14px 30px;flex-wrap:wrap}
.big{display:flex;align-items:center;gap:10px;background:var(--ac);color:var(--on);font:900 15px var(--fh);padding:13px 30px;transform:skewX(-12deg);border-radius:6px;box-shadow:5px 5px 0 rgba(0,0,0,.5);transition:transform .25s var(--ease),box-shadow .25s}
.big>*{transform:skewX(12deg)}.big:hover{transform:skewX(-12deg) translate(-2px,-2px);box-shadow:8px 8px 0 rgba(0,0,0,.5)}
.bn{margin:0 30px 12px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:16px;justify-content:space-between}
.row,.th{display:grid;grid-template-columns:44px minmax(160px,6fr) minmax(90px,4fr) 40px 40px 56px 40px;align-items:center;gap:8px;padding:0 22px;margin:0 10px}
.th{height:34px;color:var(--mu);font-size:12px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.row{position:relative;isolation:isolate;height:58px;cursor:pointer;border-radius:10px;content-visibility:auto;contain-intrinsic-size:auto 58px;transition:background .2s,transform .3s var(--ease)}
.row::before{content:"";position:absolute;inset:4px 8px;background:var(--ac);transform:skewX(-14deg) scaleX(0);transform-origin:left;border-radius:4px;z-index:-1;transition:transform .35s var(--ease)}
.row:hover{background:rgba(255,255,255,.08);transform:translateX(3px)}
.row.on::before{transform:skewX(-14deg) scaleX(1)}.row.on{color:var(--on)}
.row.on small,.row.on .al,.row.on .d,.row.on .n,.row.on .hb,.row.on .xb{color:var(--on)}
.row .n{color:var(--mu);text-align:center}.row .n svg{display:none;margin:auto}.row:hover .n span{display:none}.row:hover .n svg{display:block}
.row .t{min-width:0;display:flex;align-items:center;gap:12px}.row .t span{min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small,.row .al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tn{width:42px;height:42px;border-radius:8px;flex:none;background-size:cover}
.row.na{opacity:.7}.row.na .sb{opacity:1}.row .d{color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.hb,.xb{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--mu);transition:transform .25s var(--ease),color .2s}
.hb:hover,.xb:hover{transform:scale(1.15);color:var(--tx)}.hb.on{color:#ff5d8f}.row.on .hb.on{color:#c4003a}
.xb{opacity:0}.row:hover .xb{opacity:1}
.empty{padding:14vh 30px;text-align:center;color:var(--mu)}.empty h2{color:var(--tx);font:900 italic 34px var(--fh);text-transform:uppercase;margin-bottom:10px}
/* drawer */
#dim{position:fixed;inset:0;z-index:28;display:none}#dim.on{display:block}
#drawer{position:fixed;left:106px;top:14px;bottom:116px;width:min(380px,calc(100vw - 130px));z-index:30;display:flex;flex-direction:column;transform:translateX(-26px) scale(.97);transform-origin:left center;opacity:0;visibility:hidden;transition:transform .5s var(--ease),opacity .3s,visibility .5s}
#drawer.open{transform:none;opacity:1;visibility:visible}
#drawer h2{font:900 italic 20px var(--fh);text-transform:uppercase;padding:22px 24px 8px}
#dl2{overflow:auto;padding:6px 12px 14px;flex:1;scrollbar-width:thin}
.pi{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .2s,transform .3s var(--ease)}
.pi:hover{background:rgba(255,255,255,.12);transform:translateX(4px)}.pi.on{background:var(--ac);color:var(--on)}.pi.on small{color:var(--on)}
.open .pi{animation:up .45s var(--ease) both}.pi:nth-child(2){animation-delay:.04s}.pi:nth-child(3){animation-delay:.08s}.pi:nth-child(4){animation-delay:.12s}.pi:nth-child(n+5){animation-delay:.16s}
.pi .cv{width:46px;height:46px;font-size:19px}.pi span{flex:1;min-width:0}.pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* lyrics */
#lyr{position:absolute;inset:0;z-index:5;background:linear-gradient(165deg,var(--l1,#1b4a5a),var(--l2,#0a1a24));transform:translateY(104%);transition:transform .6s var(--ease);display:flex;flex-direction:column}
#lyr.open{transform:none}
#lh{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;gap:16px}
.lw{display:flex;gap:14px;align-items:center;min-width:0}#lc{width:64px;height:64px;font-size:26px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4)}#lh b{font-size:18px}
.lt{display:flex;gap:10px;align-items:center}.off{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 6px}.off button{width:28px;height:28px;border-radius:50%;font-size:18px}.off button:hover{background:rgba(255,255,255,.2)}#lov{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
#lyr .ib{background:rgba(0,0,0,.25);color:#fff}
#lsr{display:none;gap:8px;flex-wrap:wrap;padding:0 28px 12px;align-items:center}#lsr.on{display:flex}
#lsr input[type=text],#lsr input:not([type]){background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;user-select:text;min-width:160px}
#lsres{width:100%;max-height:170px;overflow:auto}#lsres button{display:flex;width:100%;justify-content:space-between;padding:8px 14px;border-radius:10px;text-align:left}#lsres button:hover{background:rgba(255,255,255,.15)}
#ll{flex:1;overflow:auto;padding:30vh 36px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#ll::-webkit-scrollbar{display:none}
#ll p{font-size:calc(clamp(24px,3.1vw,44px)*var(--ly));font-weight:800;line-height:1.25;margin:.5em 0;max-width:19em;color:rgba(255,255,255,.34);cursor:pointer;transition:color .3s,transform .4s var(--ease);transform-origin:left center}
#ll p:hover{color:rgba(255,255,255,.75)}#ll p.p{color:rgba(255,255,255,.5)}#ll p.c{color:#fff;transform:scale(1.04)}
#ll.plain p{color:rgba(255,255,255,.9);cursor:default;font-size:calc(22px*var(--ly));font-weight:600}
#ll .msg{font-size:20px;font-weight:600;color:rgba(255,255,255,.85);cursor:default}
#fl{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#fl i{position:absolute;left:50%;top:50%;width:75vmax;height:75vmax;margin:-37.5vmax 0 0 -37.5vmax;border-radius:50%;background:radial-gradient(circle,var(--c,#fff) 0,transparent 62%);opacity:.45;will-change:transform,opacity}
#lh,#lsr,#ll{position:relative;z-index:1}
/* bar */
#bar{grid-column:1/3;display:grid;grid-template-columns:1fr minmax(320px,1.5fr) 1fr;align-items:center;gap:16px;padding:0 24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 50px rgba(var(--tr),var(--tg),var(--tb),.35),0 20px 60px rgba(0,0,0,.38)}
#np{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer}#np .cv{width:58px;height:58px;font-size:22px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#np span{min-width:0}#np b,#np small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#ctl{display:flex;flex-direction:column;align-items:center;gap:6px}#btn{display:flex;align-items:center;gap:18px}
#btn .pp{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .25s var(--ease)}
#btn .pp:hover{transform:scale(1.1)}.sm{color:var(--mu);transition:color .2s,transform .25s var(--ease)}.sm:hover{color:var(--tx);transform:scale(1.12)}.sm[aria-pressed=true]{color:var(--ac)}.sm svg{width:19px;height:19px}
#sk{display:flex;align-items:center;gap:8px;width:100%;max-width:640px;font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}#sk span{min-width:34px}#sk span:first-child{text-align:right}
#ex{display:flex;align-items:center;justify-content:flex-end;gap:14px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(to right,var(--ac) var(--p,0%),rgba(255,255,255,.22) var(--p,0%));cursor:pointer;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
#seek::-webkit-slider-thumb,#vol::-webkit-slider-thumb{opacity:0}#seek:hover::-webkit-slider-thumb,#vol:hover::-webkit-slider-thumb{opacity:1}#vol{flex:none;width:100px}
/* settings */
#set{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,6,12,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}#set.open{opacity:1;visibility:visible}
#setbox{width:min(940px,94vw);height:min(660px,88vh);display:grid;grid-template-columns:190px 1fr;transform:scale(.95) translateY(12px);transition:transform .45s var(--ease)}.open #setbox{transform:none}
#stabs{padding:26px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--bd)}
.stab{position:relative;isolation:isolate;text-align:left;padding:11px 16px;font:900 12px var(--fh);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);transition:color .2s}
.stab::before{content:"";position:absolute;inset:0;background:var(--ac);transform:skewX(-14deg) scaleX(0);transform-origin:left;border-radius:5px;z-index:-1;transition:transform .35s var(--ease)}
.stab:hover{color:var(--tx)}.stab.on{color:var(--on)}.stab.on::before{transform:skewX(-14deg) scaleX(1)}
#spane{padding:26px 34px;overflow:auto;scrollbar-width:thin}#spane h3{font:900 italic 20px var(--fh);text-transform:uppercase;margin-bottom:12px}#spane p{margin:10px 0}
#sx{position:absolute;right:14px;top:14px}
.rw{display:flex;align-items:center;gap:14px;padding:9px 0}.rw>label{width:190px;flex:none}.rw output{width:62px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mu)}
.rw select,.rw input[type=text]{background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;user-select:text}.rw select option{background:#142030}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}.sw small{display:block}.sw input{display:none}
.tk{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:background .25s}
.tk::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .35s var(--ease)}
.sw input:checked+.tk{background:var(--ac)}.sw input:checked+.tk::after{transform:translateX(18px)}
.eq{display:flex;justify-content:space-between;gap:6px;padding:10px 0 16px}.eqb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--mu)}
.eqb input{writing-mode:vertical-lr;direction:rtl;width:6px;height:150px;flex:none;background:linear-gradient(to top,var(--ac) var(--p,50%),rgba(255,255,255,.22) var(--p,50%))}.eqb output{font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.sws{display:flex;gap:10px;padding:6px 0 12px}.swc{width:34px;height:34px;border-radius:50%;border:2px solid transparent;transition:transform .25s var(--ease)}.swc:hover{transform:scale(1.15)}.swc.on{border-color:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.4)}
#rmx{display:none;flex:1;overflow:auto;padding:16px 26px 26px;scrollbar-width:thin}
.rmx-on #view,.rmx-on #top{display:none}.rmx-on #rmx{display:block}
.rg{display:grid;grid-template-columns:1fr 290px 1fr;gap:16px;margin-top:14px}
@media(max-width:1250px){.rg{grid-template-columns:1fr 1fr}.mx{grid-column:1/3;order:-1}}
.glass2{background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.dkh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dkl{width:42px;height:42px;display:grid;place-items:center;background:var(--ac);color:var(--on);font:900 italic 22px var(--fh);transform:skewX(-12deg);border-radius:6px;flex:none}
.dkt{flex:1;min-width:0}.dkt b,.dkt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow,.rw2{display:flex;align-items:center;gap:10px;padding:5px 0}.rw2>label{width:62px;flex:none;color:var(--mu)}
.rbtn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:5px 0}.rbtn .chip,.rw2 .chip{padding:6px 14px}
.chip.on{background:var(--ac);color:var(--on)}.kb.on{background:#ff4d6d;color:#fff;border-color:transparent}
.meter{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin:4px 0 6px}.meter i{display:block;height:100%;width:0;background:var(--ac)}
.rw2 input[type=number]{width:80px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;user-select:text}
.rw2 select{background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}.rw2 select option{background:#142030}
.rw2 output{width:54px;text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
.mx h3,.dk h3{font:900 italic 16px var(--fh);text-transform:uppercase;margin:10px 0 4px}
.rrow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.rrow2 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rrow2 .chip{padding:6px 14px;display:flex;align-items:center;gap:6px}.rrow2 svg{width:14px;height:14px}
#rpall svg{width:20px;height:20px}
.srb{display:flex;gap:10px}.srb input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;user-select:text}.srb input:focus{border-color:var(--ac);outline:0}
#srd{width:min(800px,94vw);max-height:88vh}#srd[open]{display:flex;flex-direction:column}.srf{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
#srl{overflow:auto;flex:1;min-height:180px;max-height:48vh}.srh{font:900 italic 14px var(--fh);text-transform:uppercase;margin:12px 0 4px;color:var(--ac)}
.srr{display:flex;align-items:center;gap:12px;padding:7px 4px;border-radius:12px}.srr:hover{background:rgba(255,255,255,.08)}
.srt{flex:1;min-width:0}.srt b,.srt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srr .chip{padding:6px 14px;display:flex;align-items:center}.srr svg{width:14px;height:14px}
#srp{background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}#srp option{background:#142030}
#rpl{max-height:50vh;overflow:auto;margin:10px 0}#rpl button{display:flex;flex-direction:column;width:100%;padding:8px 12px;border-radius:10px;text-align:left}#rpl button:hover{background:rgba(255,255,255,.14)}
#rps{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;user-select:text}#rps:focus{border-color:var(--ac);outline:0}

const R={ctx:null,d:[null,null],xf:0,curve:'smooth',eb:.5,rec:null,raf:0,fa:0,last:0,rt:0};
const rq=(i,k)=>$('rmx').querySelector(`[data-d="${i}"] [data-rk="${k}"]`);
function rmxInit(){
  if(R.ctx)return;
  const c=R.ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'}),G=()=>c.createGain();
  R.bus=G();R.dry=G();R.echo=c.createDelay(2);R.eg=G();R.fb=G();R.rv=c.createConvolver();R.rg=G();R.sum=G();R.m=G();R.lim=c.createDynamicsCompressor();R.dest=c.createMediaStreamDestination();
  R.eg.gain.value=0;R.fb.gain.value=.4;R.rg.gain.value=0;R.m.gain.value=.9;
  R.lim.threshold.value=-1.5;R.lim.knee.value=0;R.lim.ratio.value=20;R.lim.attack.value=.002;R.lim.release.value=.08;
  [[R.bus,R.dry],[R.dry,R.sum],[R.bus,R.echo],[R.echo,R.eg],[R.eg,R.sum],[R.echo,R.fb],[R.fb,R.echo],[R.bus,R.rv],[R.rv,R.rg],[R.rg,R.sum],[R.sum,R.m],[R.m,R.lim],[R.lim,c.destination],[R.lim,R.dest]].forEach(([a,b])=>a.connect(b));
  for(let i=0;i<2;i++){
    const el=new Audio();el.preload='auto';el.crossOrigin='anonymous';el.preservesPitch=true;
    const s=c.createMediaElementSource(el),f=(t,fr,q2)=>{const b=c.createBiquadFilter();b.type=t;b.frequency.value=fr;if(q2)b.Q.value=q2;return b};
    const d={el,lo:f('lowshelf',250),mid:f('peaking',1000,.8),hi:f('highshelf',4000),flt:f('allpass',1000,.9),vol:G(),xg:G(),an:c.createAnalyser(),bpm:0,cue:0,loop:null,loopN:0,taps:[]};
    d.an.fftSize=256;d.buf=new Uint8Array(256);
    [s,d.lo,d.mid,d.hi,d.flt,d.vol,d.xg,R.bus].reduce((a,b)=>(a.connect(b),b));d.xg.connect(d.an);R.d[i]=d;el.onerror=()=>rmxErr(i);
  }
  applyXf();
}
function applyXf(){const x=(R.xf+1)/2;let a,b;if(R.curve==='sharp'){a=Math.min(1,2*(1-x));b=Math.min(1,2*x)}else{a=Math.cos(x*Math.PI/2);b=Math.sin(x*Math.PI/2)}R.d[0].xg.gain.value=a;R.d[1].xg.gain.value=b}
function fltSet(d,v){const f=d.flt;if(Math.abs(v)<.03){f.type='allpass';f.frequency.value=1000}else if(v<0){f.type='lowpass';f.frequency.value=20000*Math.pow(.005,-v)}else{f.type='highpass';f.frequency.value=20*Math.pow(400,v)}}
async function rmxBpm(o){
  try{
    let buf;
    if(o.file)buf=await o.file.slice(0,1600000).arrayBuffer();
    else{const r=await fetch(mediaSrc(o.u),{headers:{Range:'bytes=0-1599999'}});buf=await r.arrayBuffer()}
    const a=await R.ctx.decodeAudioData(buf),x=a.getChannelData(0),hop=Math.floor(a.sampleRate*.01),n=Math.floor(x.length/hop);
    const e=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=0;j<hop;j+=4){const v=x[i*hop+j];s+=v*v}e[i]=Math.sqrt(s)}
    const on=new Float32Array(n);for(let i=1;i<n;i++)on[i]=Math.max(0,e[i]-e[i-1]);
    let best=0,bl=0;for(let lag=33;lag<=86;lag++){let s=0;for(let i=lag;i<n;i++)s+=on[i]*on[i-lag];s/=(n-lag);if(s>best){best=s;bl=lag}}
    if(!bl)return 0;let bpm=6000/bl;while(bpm<80)bpm*=2;while(bpm>165)bpm/=2;return Math.round(bpm*10)/10;
  }catch(e){return 0}
}
function rmxLoad(i,o){
  const d=R.d[i];if(d.blob){URL.revokeObjectURL(d.blob);d.blob=null}
  d.el.pause();
  if(o.file){d.blob=URL.createObjectURL(o.file);d.el.removeAttribute('crossorigin');d.el.src=d.blob}else{d.el.crossOrigin='anonymous';d.el.src=mediaSrc(o.u)}
  d.cue=0;d.loop=null;d.loopN=0;d.bpm=0;d.el.playbackRate=1;rq(i,'rate').value=1;rq(i,'bpm').value='';d.direct=o.file?null:o.u;d.tried=false;
  $('rt'+i).textContent=o.name;$('ra'+i).textContent=o.art||'';
  document.querySelectorAll(`[data-d="${i}"] [data-a="loop"]`).forEach(x=>x.classList.remove('on'));
  rmxBpm(o).then(b=>{if(b){d.bpm=b;rq(i,'bpm').value=b}else toast('BPM niet gevonden. Tik de maat mee of vul de BPM in.')});
}

function rmxSync(i){
  const d=R.d[i],o=R.d[1-i];if(!d.bpm||!o.bpm){toast('Voor sync heeft elk deck een BPM nodig. Tik de maat mee of vul de BPM in.');return false}
  let r=o.bpm*o.el.playbackRate/d.bpm,best=r;for(const c of [r*2,r/2])if(c>=.5&&c<=1.5&&Math.abs(c-1)<Math.abs(best-1))best=c;

function rmxTap(i){
  const d=R.d[i],n=performance.now();if(d.taps.length&&n-d.taps[d.taps.length-1]>2000)d.taps=[];d.taps.push(n);if(d.taps.length>8)d.taps.shift();
  if(d.taps.length>=3){const iv=(d.taps[d.taps.length-1]-d.taps[0])/(d.taps.length-1);d.bpm=Math.round(60000/iv/d.el.playbackRate*10)/10;rq(i,'bpm').value=d.bpm}

function rmxFade(sec){

  if(!nd.el.src){toast('Laad eerst een nummer in deck '+'AB'[di]+'.');return}
  if(R.d[1-di].bpm&&nd.bpm)rmxSync(di);
  if(nd.el.paused)nd.el.play();
  cancelAnimationFrame(R.fa);const t0=performance.now();

function rmxLoop(now){
