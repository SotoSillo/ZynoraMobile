name: Zynora Android
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Apk bouwen
        working-directory: zynora/zynora/android-app
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zynora-apk
          path: zynora/zynora/android-app/android/app/build/outputs/apk/debug/app-debug.apk
